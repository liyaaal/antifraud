name: Import Drive project final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-drive-final:
    if: ${{ !contains(github.event.head_commit.message || '', 'Import antifraud project from Drive') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare downloader and closed asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          def decode_text_base64(text: str) -> bytes:
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              clean += '=' * (-len(clean) % 4)
              return base64.b64decode(clean)

          source = Path('.github/workflows/import-drive.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          payload = []
          grab = False
          for line in lines:
              if "cat > import_drive_project.mjs.b64 <<'EOF'" in line:
                  grab = True
                  continue
              if grab and line.strip() == 'EOF':
                  break
              if grab:
                  payload.append(line[10:] if line.startswith('          ') else line)
          if not payload:
              raise SystemExit('manifest payload not found')
          Path('import_drive_project.mjs').write_bytes(decode_text_base64('\n'.join(payload)))

          png_text = ''.join(path.read_text(encoding='utf-8') for path in sorted(Path('.github/import-assets').glob('scenarios.png.b64.*')))
          png_bytes = decode_text_base64(png_text)
          if not png_bytes.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('decoded scenarios.png has an invalid PNG signature')
          out = Path('docs/fig/scenarios.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(png_bytes)
          print(f'wrote {out} ({len(png_bytes)} bytes)')
          PY
          sed -i '/docs\/fig\/scenarios\.png/d' import_drive_project.mjs
      - name: Download listed Drive files
        run: node import_drive_project.mjs
      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          rm -f import_drive_project.mjs import_drive_project.mjs.b64
          rm -rf .github/import-assets
          rm -f .github/workflows/import-drive.yml .github/workflows/import-drive-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Import antifraud project from Drive'
          git push
