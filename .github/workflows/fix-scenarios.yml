name: Fix scenarios figure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-scenarios:
    if: ${{ !contains(github.event.head_commit.message || '', 'Fix scenarios figure import') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace scenarios figure
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-1fc0-820a-9211-36fdecd0bd7f/raw?se=2026-10-02T07%3A29%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=3bb46218-b424-480f-afba-a2367f99c97b&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A58%3A38Z&ske=2026-10-03T05%3A58%3A38Z&sks=b&skv=2026-02-06&sig=ITnGo/YT447tWs3012mjWhDkZTSaGZ%2B1y/Lh%2BqyxZ70%3D'
          mkdir -p docs/fig
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o docs/fig/scenarios.png
          bytes=$(wc -c < docs/fig/scenarios.png | tr -d ' ')
          test "$bytes" = '78369'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/fig/scenarios.png')
          data = p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('invalid PNG signature')
          print(f'validated {p}: {len(data)} bytes')
          PY
      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-scenarios.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix scenarios figure import'
          git push
