name: Import Drive project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-drive:
    if: ${{ !contains(github.event.head_commit.message || '', 'Import antifraud project from Drive') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create manifest downloader
        shell: bash
        run: |
          cat > import_drive_project.mjs.b64 <<'EOF'
          
          EOF
          sed -i 's/^          //' import_drive_project.mjs.b64
          base64 -d import_drive_project.mjs.b64 > import_drive_project.mjs
      - name: Download listed Drive files
        run: node import_drive_project.mjs
      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          rm -f import_drive_project.mjs import_drive_project.mjs.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Import antifraud project from Drive'
          git push
